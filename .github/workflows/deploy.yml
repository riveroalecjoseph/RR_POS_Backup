name: Dual CI/CD Pipeline (Desktop & Web)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 (Desktop): Windows Desktop Installer Build & Artifact Upload
  # ---------------------------------------------------------------------------
  build-desktop:
    name: Build Windows Desktop Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Installer Artifacts (.msi / .exe)
        uses: actions/upload-artifact@v4
        with:
          name: RR-POS-Windows-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/**
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 2 (Web): Static Web Build & GitHub Pages Deployment
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Build & Deploy Web Distribution to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web distribution
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy static app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
